<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dictionary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <style>
      body {
        font-family: 'Poppins', sans-serif;
      }
    </style>
  </head>
  <body class="bg-white min-h-screen flex flex-col justify-start transition-colors duration-300 pt-12">
    <main class="flex flex-col items-center px-6">
      <h1 class="text-4xl font-semibold text-black mb-10">Dictionary</h1>
      <div class="w-full max-w-xl relative mb-6">
        <input id="searchInput" type="text" placeholder="Search for a word or sentence" class="w-full border border-gray-300 rounded-xl py-3 px-5 pr-12 text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-orange-400" />
        <i id="searchIcon" class="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg cursor-pointer"></i>
      </div>

      <div class="flex items-center space-x-4 mb-6 w-full max-w-xl">
        <button aria-label="Play pronunciation" id="playAudio" class="border border-gray-300 rounded-full p-4 text-orange-400 hover:bg-orange-50 focus:outline-none focus:ring-2 focus:ring-orange-400">
          <i class="fas fa-volume-up text-xl"></i>
        </button>
        <h2 id="translated-word" class="text-2xl font-semibold text-orange-400"></h2>
      </div>

      <div class="w-full max-w-xl">
        <p class="text-base text-black mb-1">Meaning :</p>
        <p id="meaning" class="text-base text-black"></p>
      </div>
      <div class="w-full max-w-xl mt-4">
        <p class="text-base text-black mb-1">Example :</p>
        <p id="example" class="text-base text-black"></p>
      </div>
    </main>

    <footer class="text-center py-6 text-sm text-black font-mono mt-auto">
      @partharabha
    </footer>

    <script>
      const dictionary = {
        "gohan": { translation: "rice", meaning: "A type of food; rice.", meaningJ: "Gohan wa tabemono desu.", example: "Gohan kudasai.", exampleE: "Please give me rice." },
        "rice": { translation: "gohan", meaning: "A type of food; rice.", meaningJ: "Gohan wa tabemono desu.", example: "Gohan kudasai.", exampleE: "Please give me rice." },
        "neko": { translation: "cat", meaning: "A small domesticated carnivorous mammal.", meaningJ: "Chiisana katei no doubutsu.", example: "Neko wa kawaii desu.", exampleE: "The cat is cute." },
        "cat": { translation: "neko", meaning: "A small domesticated carnivorous mammal.", meaningJ: "Chiisana katei no doubutsu.", example: "Neko wa kawaii desu.", exampleE: "The cat is cute." },
        "konnichiwa": { translation: "hello", meaning: "A greeting used during the day.", meaningJ: "Hiruma ni tsukau aisatsu.", example: "Konnichiwa! Ogenki desu ka?", exampleE: "Hello! How are you?" },
        "hello": { translation: "konnichiwa", meaning: "A greeting used during the day.", meaningJ: "Hiruma ni tsukau aisatsu.", example: "Konnichiwa! Ogenki desu ka?", exampleE: "Hello! How are you?" },
      };

      const input = document.getElementById("searchInput");
      const icon = document.getElementById("searchIcon");
      const translatedWord = document.getElementById("translated-word");
      const meaningEl = document.getElementById("meaning");
      const exampleEl = document.getElementById("example");
      const audioBtn = document.getElementById("playAudio");

      async function translateSentence(text, from = "en", to = "ja") {
        const res = await fetch("https://libretranslate.com/translate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ q: text, source: from, target: to, format: "text" })
        });
        const data = await res.json();
        return data.translatedText;
      }

      const searchWord = async () => {
        const query = input.value.trim();
        if (!query) return;

        if (query.split(" ").length > 1) {
          const fromLang = /^[a-zA-Z ]+$/.test(query) ? "en" : "ja";
          const toLang = fromLang === "en" ? "ja" : "en";
          const translated = await translateSentence(query, fromLang, toLang);
          translatedWord.textContent = translated;
          meaningEl.textContent = `Sentence translation:`;
          exampleEl.textContent = `"${query}" → "${translated}"`;
        } else {
          const entry = dictionary[query.toLowerCase()];
          if (entry) {
            translatedWord.textContent = entry.translation;
            const isEnglish = /^[a-zA-Z ]+$/.test(query);
            meaningEl.textContent = isEnglish ? `${entry.meaning} (${entry.meaningJ})` : `${entry.meaningJ} (${entry.meaning})`;
            exampleEl.textContent = isEnglish ? `${entry.exampleE} (${entry.example})` : `${entry.example} (${entry.exampleE})`;
          } else {
            translatedWord.textContent = "Not found";
            meaningEl.textContent = "No meaning found.";
            exampleEl.textContent = "No example found.";
          }
        }
      };

      input.addEventListener("input", searchWord);
      icon.addEventListener("click", searchWord);
      input.addEventListener("keydown", e => e.key === "Enter" && searchWord());

      audioBtn.addEventListener("click", () => {
        const word = translatedWord.textContent;
        if (!word || word === "Not found") return;
        const utter = new SpeechSynthesisUtterance(word);
        utter.lang = /^[a-zA-Z ]+$/.test(word) ? "en-US" : "ja-JP";
        speechSynthesis.speak(utter);
      });
    </script>
  </body>
</html>
